<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Shooter</title>
    <meta name="manifest.type" content="browser_action" />
  </head>
  <body>
    <main class="popup">
      <header class="popup-header">
        <img src="/icons/32.png" width="20" height="20" alt="" />
        <h1 data-i18n="extName"></h1>
        <button id="settings" class="icon-button" type="button" data-i18n-title="popupSettings">
          <svg
            viewBox="0 0 24 24"
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path
              d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"
            />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </button>
      </header>

      <div class="capture-buttons">
        <button class="button primary" type="button" data-mode="visible">
          <svg
            viewBox="0 0 24 24"
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path
              d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"
            />
            <circle cx="12" cy="12" r="3" />
          </svg>
          <span data-i18n="captureVisible"></span>
        </button>
        <button class="button" type="button" data-mode="fullPage">
          <svg
            viewBox="0 0 24 24"
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="5" y="2" width="14" height="20" rx="2" />
            <path d="M9 7h6M9 11h6M9 15h4" />
          </svg>
          <span data-i18n="captureFullPage"></span>
        </button>
      </div>

      <p id="status" class="status" role="status" aria-live="polite" hidden></p>
      <img id="preview" class="preview" alt="" hidden />

      <footer class="popup-footer">
        <div class="shortcut-row">
          <span data-i18n="captureVisible"></span>
          <span class="keys" data-shortcut="visible"></span>
        </div>
        <div class="shortcut-row">
          <span data-i18n="captureFullPage"></span>
          <span class="keys" data-shortcut="fullPage"></span>
        </div>
      </footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
